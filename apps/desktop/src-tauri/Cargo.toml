[package]
name = "cryptex-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
m11-installed-search-check = ["tauri/custom-protocol", "cryptexd/m11-installed-search-check"]
m8-device-recovery-check = ["tauri/custom-protocol", "cryptexd/m8-start-inspection"]
m8-local-startup-check = ["cryptexd/m8-local-startup-check", "tauri/custom-protocol"]
m8-development-product = ["m8-local-startup-check", "cryptexd/m8-development-product"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
serde_json.workspace = true
serde.workspace = true
tauri.workspace = true
tauri-plugin-opener = "=2.6.0"
rfd = { version = "=0.16.0", default-features = false }
tempfile = "=3.27.0"
tauri-plugin-single-instance.workspace = true
cryptexd = { path = "../../../services/cryptexd" }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tauri-plugin-autostart = "=2.6.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
rusqlite.workspace = true

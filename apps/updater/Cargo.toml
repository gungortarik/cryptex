[package]
name = "cryptex-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
owner-transport-update = ["dep:cryptexd"]

[target.'cfg(windows)'.dependencies]
cryptexd = { path = "../../services/cryptexd", optional = true, features = ["m17-owner-transport"] }

[target.'cfg(target_os = "macos")'.dependencies]
cryptexd = { path = "../../services/cryptexd", optional = true, features = ["m17-owner-transport", "m17-sealed-profile-trial"] }

[build-dependencies]
cc = "=1.5.1"

[dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["std", "job-object", "process-group"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = "=3.27.0"

[package]
name = "m1-secure-store-spike"
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false
description = "Product-separated ADR-0014 secure-store evaluation spike (not a Cryptex product dependency)."

# Intentionally a standalone workspace root so this package is NOT a member of
# the Cryptex product workspace and cannot inherit/pin product dependencies.
[workspace]

[[bin]]
name = "m1-secure-store-spike"
path = "src/main.rs"

[dependencies]
keyring-core = "=1.0.0"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
widestring = "=1.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }
security-framework = "=3.7.0"

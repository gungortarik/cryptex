[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/core",
  "crates/events",
  "crates/storage",
  "services/cryptexd",
  "tools/m0-ipc-spike",
  "tools/m0-storage-bench",
  "tools/m0-lifecycle-compare",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
version = "0.0.0"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = { version = "=1.2.2", features = ["derive"] }
tauri = { version = "=2.12.0", features = ["tray-icon"] }
tauri-build = "=2.7.0"
tauri-plugin-single-instance = "=2.3.0"

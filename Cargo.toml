[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/core",
  "services/cryptexd",
  "tools/m0-ipc-spike",
  "tools/m0-storage-bench",
  "tools/m0-lifecycle-compare",
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
version = "0.0.0"

[workspace.dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon"] }
tauri-build = "=2.7.0"
tauri-plugin-single-instance = "=2.3.0"

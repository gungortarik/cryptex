name: M8 local canonical verification
on:
  push:
    branches: [codex/m8-device-trust]
    paths:
      - services/cryptexd/src/knowledge_materialization/local_receipt/**
      - services/cryptexd/src/knowledge_materialization/local_receipt.rs
      - services/cryptexd/src/knowledge_materialization.rs
      - services/cryptexd/src/import_staging.rs
      - services/cryptexd/src/main.rs
      - scripts/m8/lan_canonical_verification.py
      - scripts/m8/test_lan_canonical_verification.py
      - scripts/m8/package_canonical_verification.py
      - scripts/m8/mac_existing_update.py
      - scripts/m8/test_mac_existing_update.py
      - .github/workflows/m8-local-verification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            features: ''
          - os: macos-latest
            features: '--features m8-development-product'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # Public compile-only fixture pin. No private key/Keychain enrollment or
      # Mac artifact distribution; owner builds use their own existing signer.
      CRYPTEX_M8_DEVELOPMENT_CERT_DER: ${{ github.workspace }}/services/cryptexd/src/m8_owner_channel/release_inventory/fixtures/signer.der
      CRYPTEX_M8_DEVELOPMENT_RELEASE_ID: cryptex-dev-local-verifier-ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: |
          cargo test --locked -p cryptexd ${{ matrix.features }} --lib knowledge_materialization::local_receipt::tests:: -- --test-threads=1
      - run: cargo test --locked -p cryptexd ${{ matrix.features }} --bin cryptexd verify_local_cli_ -- --test-threads=1
      - run: cargo clippy --locked -p cryptexd ${{ matrix.features }} --all-targets -- -D warnings
      - run: python3 -B -m unittest discover -s scripts/m8 -p test_lan_canonical_verification.py
      - name: Verify repeatable Mac build without a product launcher
        if: runner.os == 'macOS'
        run: python3 -B -m unittest discover -s scripts/m8 -p test_mac_existing_update.py
      - name: Build isolated Windows verifier
        if: runner.os == 'Windows'
        run: cargo build --locked -p cryptexd
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
      - name: Bind Windows artifact to exact source
        if: runner.os == 'Windows'
        shell: python
        run: |
          import hashlib, json, os, pathlib, shutil
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'local-verifier'
          out.mkdir()
          target = out / 'cryptexd.exe'
          shutil.copyfile('target/debug/cryptexd.exe', target)
          assert target.stat().st_size <= 64 * 1024 * 1024
          (out / 'provenance.json').write_text(json.dumps(dict(
              source_commit=os.environ['GITHUB_SHA'], run_id=os.environ['GITHUB_RUN_ID'],
              daemon_sha256=hashlib.sha256(target.read_bytes()).hexdigest())), encoding='utf-8')
      - name: Build and read back shared acceptance packet
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -B scripts/m8/package_canonical_verification.py --artifact "$env:RUNNER_TEMP/local-verifier" --revision HEAD --output "$env:RUNNER_TEMP/local-verifier-packet.zip"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: cryptex-local-verifier-${{ github.sha }}
          path: ${{ runner.temp }}/local-verifier/
          if-no-files-found: error

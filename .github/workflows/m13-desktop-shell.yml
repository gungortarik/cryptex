name: M13 desktop shell
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m13-desktop-shell.yml'
      - 'apps/desktop/src-tauri/src/shell_check.rs'
      - 'apps/desktop/src-tauri/src/shell_shortcut_check.js'
      - 'scripts/m13/check-shell.py'
      - 'apps/desktop/scripts/connection-screen.test.mjs'
      - 'apps/desktop/src/App.tsx'
      - 'apps/desktop/src/EngineControls.tsx'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - 'apps/desktop/src/styles.css'
      - 'apps/desktop/src/ConnectionSettings.tsx'
      - 'apps/desktop/src/PublicReadReview.tsx'
      - 'apps/desktop/src/connection-settings.*'
      - 'apps/desktop/src-tauri/src/candidate_ui.rs'
      - 'services/cryptexd/src/ipc/tests/maintenance_tests.rs'
      - 'services/cryptexd/src/ipc/public_consent.rs'
      - 'services/cryptexd/src/managed_profile/connection_settings/**'
      - 'apps/desktop/src-tauri/src/main.rs'
permissions:
  contents: read
jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cryptex/desktop build
      - name: Check service loss, recovery and navigation in the rendered desktop UI
        run: pnpm --filter @cryptex/desktop test:connection-screen
        env:
          CRYPTEX_M13_RENDER_DIR: ${{ runner.temp }}/cryptex-m13-render
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-desktop-${{ matrix.os }}
          path: ${{ runner.temp }}/cryptex-m13-render/*.png
          if-no-files-found: error
      - run: cargo fmt --all -- --check
      - run: cargo build --locked -p cryptex-desktop --features m13-shell-check
      - run: cargo build --locked -p cryptexd --bin cryptexd --features disposable-ipc
      - name: Exercise the native window and embedded WebView in a disposable profile
        if: runner.os == 'macOS'
        run: python scripts/m13/check-shell.py
      - name: Prepare the pinned transport for the two-device maintenance check
        if: runner.os == 'Windows'
        run: python scripts/m8/prepare_native_test_package.py
      - name: Exercise the native window with standard-user file ownership
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/m8/run-daemon-tests-standard-user-ci.ps1 -M13DesktopShell -ExchangePackage "$env:RUNNER_TEMP/exchange-package"
      - name: Verify Mac owner controls, local capture and guarded search during maintenance
        if: runner.os == 'macOS'
        shell: bash
        env:
          CRYPTEX_M8_DEVELOPMENT_CERT_DER: ${{ github.workspace }}/services/cryptexd/src/m8_owner_channel/release_inventory/fixtures/signer.der
          CRYPTEX_M8_DEVELOPMENT_RELEASE_ID: cryptex-dev-maintenance-ci
        run: |
          set -euo pipefail
          cargo check --locked -p cryptex-desktop --features m8-development-product
          suite=ipc::tests::maintenance_tests::maintenance_preserves_local_read_and_capture_and_restores_prior_ai_policy
          cargo test --locked -p cryptexd --features m8-development-product --lib "$suite" -- --exact | tee "$RUNNER_TEMP/maintenance.log"
          grep -Fx "test $suite ... ok" "$RUNNER_TEMP/maintenance.log"

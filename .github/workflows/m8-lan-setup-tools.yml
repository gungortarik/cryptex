name: M8 LAN setup tooling

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  setup-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install repository Rust toolchain for archive build
        if: runner.os == 'macOS'
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test setup launcher, diagnostics and receipt boundaries
        run: |
          python -B -m unittest discover -s scripts/m8 -p test_mac_lan_setup.py
          python -B -m unittest discover -s scripts/m8 -p test_lan_setup_receipt.py
          python -B -m unittest discover -s scripts/m8 -p test_mac_identity_preflight.py
          python -B -m unittest discover -s scripts/m8 -p test_windows_setup_native.py
          python -B -m unittest discover -s scripts/m8 -p test_windows_lan_setup.py
          python -B -m unittest discover -s scripts/m8 -p test_windows_lan_receipt.py
      - name: Download exact previously verified Windows product
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43905651278
          name: cryptex-windows-package-3d8e5b4756f7a6c91ae245c630a48efc645c0a50
          path: ${{ runner.temp }}/lan-product
      - name: Exercise actual Windows persistent enrollment and duplicate refusal
        if: runner.os == 'Windows'
        run: ./scripts/m8/run-daemon-tests-standard-user-ci.ps1 -LanSetupOnly -LanArtifact "${{ runner.temp }}/lan-product"
      - name: Execute actual pinned frontend tools through the Mac setup function
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python3 -B - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/m8')
          from mac_lan_setup import build_frontend, tool
          from mac_identity_preflight import run_bounded, checked
          def run(args, label, timeout):
              outcome = run_bounded([str(a) for a in args], timeout, tool_path=os.environ['PATH'])
              return checked(lambda *_: outcome, [], label, timeout)
          report = {}
          build_frontend(Path.cwd(), tool('node'), tool('pnpm'), run, report)
          assert report['build_tools'] == {'node': '24.19.0', 'pnpm': '11.28.0'}
          print('actual_frontend_setup_launcher=passed')
          PY
      - name: Compile actual product from owner packet source archive
        if: runner.os == 'macOS'
        run: python3 -B scripts/m8/mac_lan_archive_build_ci.py
      - name: Verify owner CMS helper with exact synthetic CI key access
        if: runner.os == 'macOS'
        run: python3 -B scripts/m8/mac_owner_cms_ci.py

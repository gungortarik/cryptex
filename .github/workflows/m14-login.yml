name: M14 login startup
on:
  workflow_dispatch:
  push:
    branches: ['codex/m14-login-startup']
    paths:
      - '.github/workflows/m14-login.yml'
      - 'scripts/m14/**'
      - 'apps/desktop/src-tauri/**'
permissions:
  contents: read
jobs:
  login:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: target/debug/cryptex-desktop.exe
          - os: macos-latest
            binary: target/debug/cryptex-desktop
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cryptex/desktop build
      - run: cargo fmt --all -- --check
      - run: cargo build --locked -p cryptex-desktop --features m14-login-check
      - name: Reject duplicates, stale sessions and incomplete removal
        run: python -B -m unittest discover -s scripts/m14
      - name: Enable twice, exercise the registered launch and verify removal
        run: python -B scripts/m14/login.py --ci --binary "${{ matrix.binary }}"
      - run: python scripts/m14/package_login.py "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: m14-login-${{ runner.os }}
          path: ${{ runner.temp }}/Cryptex-M14-*.zip
          if-no-files-found: error

name: M10 reversible forget
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m10-forget-restore.yml'
      - 'services/cryptexd/src/m10_forget_restore.rs'
      - 'services/cryptexd/src/test_temp.rs'
      - 'services/cryptexd/src/ipc.rs'
      - 'services/cryptexd/src/ipc/lifecycle.rs'
      - 'services/cryptexd/src/ipc/lifecycle/**'
      - 'services/cryptexd/src/ipc/tests/purge_tests.rs'
      - 'services/cryptexd/src/m8_owner_channel/request.rs'
      - 'services/cryptexd/src/knowledge_materialization.rs'
      - 'services/cryptexd/src/knowledge_materialization/ai_context.rs'
      - 'services/cryptexd/src/trust_reducer.rs'
      - 'crates/events/**'
      - 'crates/storage/**'
      - 'crates/projection/**'
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify forget and restore in disposable profiles
        shell: pwsh
        run: |
          $options = @('test', '--locked', '-p', 'cryptexd', '--lib', 'm10_forget_restore::')
          $cases = cargo @options -- --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($case in 'forgotten_and_restored_views_survive_profile_reopen', 'invalid_controls_cannot_change_visibility', 'normal_reads_enforce_signed_visibility_with_an_unchanged_index', 'vault_refresh_removes_and_restores_the_managed_note', 'ai_context_excludes_forgotten_public_notes_with_a_stale_index') {
            if ($cases -notcontains "m10_forget_restore::${case}: test") { throw "Missing test $case" }
          }
          cargo @options
          exit $LASTEXITCODE
      - name: Verify unconfirmed purge requests preserve signed records
        shell: pwsh
        run: |
          $case = 'ipc::tests::purge_tests::unconfirmed_purge_requests_preserve_all_records'
          $result = cargo test --locked -p cryptexd --lib $case -- --exact
          $result
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($result -notcontains "test $case ... ok") { throw "Missing purge test result" }
      - name: Check owner authorization for the forgotten picker and reversible changes
        run: cargo test --locked -p cryptexd --lib ipc::lifecycle::tests
      - name: Check existing search and timeline behavior
        run: cargo test --locked -p cryptex-projection --lib search::tests
      - name: Check existing signed-history rules
        run: cargo test --locked -p cryptex-events --lib security_history::tests
      - name: Check managed vault publication and file ownership
        run: cargo test --locked -p cryptex-projection --lib vault::tests

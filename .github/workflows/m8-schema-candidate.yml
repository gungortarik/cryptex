name: M8 schema candidate
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  schemas:
    name: Schema candidate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          pnpm install --frozen-lockfile
      - name: Check formatting
        run: python -B tools/m8-protocol-vectors/check_format.py
      - name: Generate schemas from actual Rust wire types
        run: cargo run --locked -p cryptex-events --bin cryptex-events-schema-gen
      - name: Generate and check TypeScript
        run: |
          pnpm --filter @cryptex/schemas generate:ts
          pnpm --filter @cryptex/schemas check:drift
          git diff --exit-code -- packages/schemas
      - name: Strict lint and event compatibility tests
        run: |
          python -m pip install -r tools/m8-protocol-vectors/schema-requirements.txt
          python -B tools/m8-protocol-vectors/check_schemas.py
          cargo clippy --locked -p cryptex-events --all-targets -- -D warnings
          cargo test --locked -p cryptex-events
      - name: Check out exact historical product reader
        uses: actions/checkout@v4
        with:
          ref: ae61603b517f68b63d559ccb5ee77d744176e6a6
          path: .old-product-reader
          persist-credentials: false
      - name: Verify historical product Brain hold and immutable bytes
        run: python -B tools/m8-protocol-vectors/run_old_reader_compat.py --old-root .old-product-reader
      - uses: actions/upload-artifact@v4
        with:
          name: m8-old-reader-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/m8-old-reader-result.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: m8-schemas-${{ matrix.os }}-${{ github.sha }}
          path: |
            packages/schemas/cryptex*.schema.json
            packages/schemas/cryptex*.ts
          if-no-files-found: error

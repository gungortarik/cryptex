name: Mac window collector checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collector:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test package, failure handling and actual Darwin process groups
        run: /usr/bin/python3 -B -m unittest discover -s scripts/m8 -p 'test_mac_window*.py' -v

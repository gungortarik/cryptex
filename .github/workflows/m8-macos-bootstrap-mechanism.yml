name: M8 Mac public bootstrap mechanism experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mechanism:
    runs-on: macos-latest
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Test closed mechanism receipts and failure preservation
        run: python3 -B -m unittest discover -s scripts/m8 -p 'test_mac_bootstrap_mechanism.py' -v
      - name: Compile public APIs and run disposable ad-hoc fixture experiment
        run: python3 -B scripts/m8/mac_bootstrap_mechanism.py --ci
        # No owner signing key, launchd installation, product IPC or mutation gate.

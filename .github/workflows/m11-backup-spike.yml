name: M11 backup container
on:
  workflow_dispatch:
  push:
    paths:
      - 'services/cryptexd/src/knowledge_materialization/backup.rs'
      - 'services/cryptexd/src/knowledge_materialization/backup/**'
      - 'services/cryptexd/backup-codec/**'
      - 'services/cryptexd/src/backup_inventory.rs'
      - 'Cargo.lock'
      - 'services/cryptexd/src/backup_scheduler/**'
      - 'services/cryptexd/src/backup_scheduler.rs'
      - 'tools/m11-backup-spike/**'
      - 'apps/desktop/src/**'
      - 'apps/desktop/src-tauri/src/**'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - 'apps/desktop/src-tauri/tauri*.json'
      - 'services/cryptexd/Cargo.toml'
      - 'apps/desktop/scripts/recovered-search.test.mjs'
      - 'services/cryptexd/src/ipc.rs'
      - 'services/cryptexd/src/main.rs'
      - 'services/cryptexd/src/secure_store/**'
      - 'services/cryptexd/src/knowledge_materialization/recovered_search.rs'
      - 'services/cryptexd/src/ipc/recovered_desktop.rs'
      - 'services/cryptexd/src/ipc/backup*.rs'
      - 'services/cryptexd/src/ipc/backup_writer/**'
      - 'services/cryptexd/src/knowledge_materialization/m11_installed_export.rs'
      - 'services/cryptexd/src/knowledge_materialization/m11_separate_backups.rs'
      - 'services/cryptexd/src/knowledge_materialization/m11_backup_read.rs'
      - 'services/cryptexd/src/knowledge_materialization/m11_first_device.rs'
      - 'services/cryptexd/src/knowledge_materialization/m11_restarted_search.rs'
      - 'services/cryptexd/src/knowledge_materialization/pairing_recovery_tests.rs'
      - '.github/workflows/m11-backup-spike.yml'
      - 'crates/events/tests/fixtures/m8-old-reader-v1-v3.json'
      - '.node-version'
  pull_request:
    paths:
      - 'services/cryptexd/src/knowledge_materialization/backup.rs'
      - 'services/cryptexd/src/knowledge_materialization/backup/**'
      - 'services/cryptexd/backup-codec/**'
      - 'services/cryptexd/src/backup_inventory.rs'
      - 'Cargo.lock'
      - 'services/cryptexd/src/backup_scheduler/**'
      - 'services/cryptexd/src/backup_scheduler.rs'
      - 'tools/m11-backup-spike/**'
      - 'apps/desktop/src/**'
      - 'apps/desktop/src-tauri/src/**'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - 'apps/desktop/src-tauri/tauri*.json'
      - 'services/cryptexd/Cargo.toml'
      - 'apps/desktop/scripts/recovered-search.test.mjs'
      - 'services/cryptexd/src/ipc.rs'
      - 'services/cryptexd/src/main.rs'
      - 'services/cryptexd/src/secure_store/**'
      - 'services/cryptexd/src/knowledge_materialization/recovered_search.rs'
      - 'services/cryptexd/src/ipc/recovered_desktop.rs'
      - 'services/cryptexd/src/ipc/backup*.rs'
      - 'services/cryptexd/src/ipc/backup_writer/**'
      - 'services/cryptexd/src/knowledge_materialization/m11_installed_export.rs'
      - 'services/cryptexd/src/knowledge_materialization/m11_separate_backups.rs'
      - 'services/cryptexd/src/knowledge_materialization/m11_backup_read.rs'
      - 'services/cryptexd/src/knowledge_materialization/m11_first_device.rs'
      - 'services/cryptexd/src/knowledge_materialization/m11_restarted_search.rs'
      - 'services/cryptexd/src/knowledge_materialization/pairing_recovery_tests.rs'
      - '.github/workflows/m11-backup-spike.yml'
      - 'crates/events/tests/fixtures/m8-old-reader-v1-v3.json'
      - '.node-version'

permissions:
  contents: read
jobs:
  native-codec:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix tools/m11-backup-spike --ignore-scripts
      - name: Read native signed and encrypted output with the existing recovery reader
        shell: bash
        run: |
          set -euo pipefail
          manifest=tools/m11-backup-spike/native-codec/Cargo.toml
          binary=tools/m11-backup-spike/native-codec/target/debug/m11-native-codec-trial
          if [[ "$RUNNER_OS" == macOS ]]; then export OPENSSL_DIR="$(brew --prefix openssl@3)"; else binary="$binary.exe"; fi
          cargo fmt --manifest-path "$manifest" -- --check
          cargo clippy --locked --manifest-path "$manifest" -- -D warnings
          cargo build --locked --manifest-path "$manifest"
          python -B tools/m11-backup-spike/test_native_codec.py "$binary" | tee "$RUNNER_TEMP/m11-codec.txt"
          grep -Fx 'm11_native_writer=passed js_restore=verified wrong_recipient=denied wrong_signer=denied' "$RUNNER_TEMP/m11-codec.txt" >> "$GITHUB_STEP_SUMMARY"
  rehearsal:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix tools/m11-backup-spike --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cryptex/desktop build
      - run: python -B tools/m11-backup-spike/rehearse.py
      - name: Verify atomic restore publication and retry
        run: python -B tools/m11-backup-spike/test_restore_publication.py
      - name: Verify the offline Recovery Kit recipient before enrollment
        run: python -B tools/m11-backup-spike/test_public_recipient.py
      - name: Check authenticated manual decryption and its per-file size bound
        run: python -B tools/m11-backup-spike/test_restore_codec.py
      - name: Reject unsigned legacy backups and ambiguous envelopes
        run: python -B tools/m11-backup-spike/test_inventory_envelope.py
      - name: Verify recovered notes and attachments through guarded daemon reads
        shell: bash
        env:
          CRYPTEX_M11_DESKTOP_BROWSER: "1"
          CRYPTEX_M8_LOCAL_STARTUP_CERT_DER: ${{ github.workspace }}/services/cryptexd/src/m8_owner_channel/release_inventory/fixtures/signer.der
        run: |
          set -euo pipefail
          features=()
          if [[ "$RUNNER_OS" == macOS ]]; then features=(--features m8-local-startup-check); fi
          cargo clippy --locked -p cryptexd --lib --tests "${features[@]}" -- -D warnings
          cargo test --locked -p cryptexd --lib "${features[@]}" ipc::purge_review::backup_test::verified_backup_preserves_purge_and_unaffected_notes -- --exact --ignored --nocapture | tee "$RUNNER_TEMP/m11-purge-backup.txt"
          grep -F '1 passed; 0 failed' "$RUNNER_TEMP/m11-purge-backup.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_backup_removal_ui=passed cancelled=kept confirmed=removed replay=denied replacement=restored' "$RUNNER_TEMP/m11-purge-backup.txt" >> "$GITHUB_STEP_SUMMARY"
          cargo test --locked -p cryptexd --lib "${features[@]}" knowledge_materialization::pairing_recovery_tests::m11_backup_read::public_kit_allows_ordinary_backup_but_partial_recovery_holds -- --exact | tee "$RUNNER_TEMP/m11-public-kit.txt"
          grep -F '1 passed; 0 failed' "$RUNNER_TEMP/m11-public-kit.txt" >> "$GITHUB_STEP_SUMMARY"
          cargo test --locked -p cryptexd --lib "${features[@]}" ipc::backup_export::tests
          cargo test --locked -p cryptexd --lib "${features[@]}" ipc::backup_verify::tests
          cargo test --locked -p cryptexd --lib "${features[@]}" ipc::backup_writer::tests
          cargo test --locked -p cryptexd --lib "${features[@]}" ipc::backup_removal::tests
          cargo test --locked -p cryptexd --lib "${features[@]}" backup_scheduler::journal::tests
          cargo test --locked -p cryptexd --lib "${features[@]}" knowledge_materialization::pairing_recovery_tests::m11_backup_read::a_forgotten_notes_attachment_survives_backup_reconstruction -- --exact | tee "$RUNNER_TEMP/m11-forgotten-attachment.txt"
          grep -F '1 passed; 0 failed' "$RUNNER_TEMP/m11-forgotten-attachment.txt" >> "$GITHUB_STEP_SUMMARY"
          cargo test --locked -p cryptexd --lib "${features[@]}" knowledge_materialization::backup::manual::tests::manual_publication_preserves_existing_and_incomplete_exports -- --exact | tee "$RUNNER_TEMP/m11-manual-export.txt"
          grep -F '1 passed; 0 failed' "$RUNNER_TEMP/m11-manual-export.txt" >> "$GITHUB_STEP_SUMMARY"
          cargo test --locked -p cryptexd --lib "${features[@]}" knowledge_materialization::pairing_recovery_tests::m11_backup_read::scheduled_writer_relinquishes_before_a_peer_takes_the_same_target -- --exact | tee "$RUNNER_TEMP/m11-role.txt"
          grep -F '1 passed; 0 failed' "$RUNNER_TEMP/m11-role.txt" >> "$GITHUB_STEP_SUMMARY"
          cargo test --locked -p cryptexd --lib "${features[@]}" \
            knowledge_materialization::pairing_recovery_tests::m11_backup_read::next_backup_restores_the_offline_capture_after_reconnection \
            -- --exact --ignored --nocapture | tee "$RUNNER_TEMP/m11-next-backup.txt"
          grep -Fx 'm11_reconnected_backup=passed generations=2 original=preserved offline_capture=restored receipt=matched' "$RUNNER_TEMP/m11-next-backup.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_scheduled_reconnect=passed designated=published peer=skipped offline_capture=restored' "$RUNNER_TEMP/m11-next-backup.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_backup_job_restart=passed offline_exit=recovered published_replay=idempotent' "$RUNNER_TEMP/m11-next-backup.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_retention=passed default=keep_all retained=1 manual=restored unverified=preserved damaged=blocked' "$RUNNER_TEMP/m11-next-backup.txt" >> "$GITHUB_STEP_SUMMARY"
          cargo test --locked -p cryptexd --lib "${features[@]}" \
            knowledge_materialization::pairing_recovery_tests::m11_backup_read::restored_note_and_attachment_pass_guarded_reads \
            -- --exact --ignored --nocapture | tee "$RUNNER_TEMP/m11-daemon-read.txt"
          grep '^m11_guarded_restore=passed ' "$RUNNER_TEMP/m11-daemon-read.txt" >> "$GITHUB_STEP_SUMMARY"
          grep '^m11_first_device=passed ' "$RUNNER_TEMP/m11-daemon-read.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_portable_kit=passed source=lost wrong_unlock=denied decrypt=restored bootstrap=authorized' "$RUNNER_TEMP/m11-daemon-read.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_backup_inventory=passed daemon_signed=true public_only_encryption=true legacy=restored replay=matched' "$RUNNER_TEMP/m11-daemon-read.txt" >> "$GITHUB_STEP_SUMMARY"
          grep '^m11_restarted_search=passed ' "$RUNNER_TEMP/m11-daemon-read.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_offline_backup_target=passed capture=committed search=reopened backup=unchanged' "$RUNNER_TEMP/m11-daemon-read.txt" >> "$GITHUB_STEP_SUMMARY"
          grep '^m11_desktop_search=passed ' "$RUNNER_TEMP/m11-daemon-read.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Install the isolated Desktop and search in two fresh WebView sessions
        shell: bash
        env:
          CRYPTEX_M8_LOCAL_STARTUP_CERT_DER: ${{ github.workspace }}/services/cryptexd/src/m8_owner_channel/release_inventory/fixtures/signer.der
        run: |
          set -euo pipefail
          python -B tools/m11-backup-spike/installed_desktop.py install | tee "$RUNNER_TEMP/m11-installed.txt"
          grep -Fx 'm11_installed_retention=passed default=keep_all wrong_unlock=held scheduled_cipher=restored' "$RUNNER_TEMP/m11-installed.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_installed_schedule=passed restarted=true generation=1 paused=true original_note_restored=true' "$RUNNER_TEMP/m11-installed.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_installed_writer=passed consent=required assignment=reopened copied_target=held' "$RUNNER_TEMP/m11-installed.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_recipient_enrollment=passed wrong_brain=held decline=kept offline_restart=restored modified_certificate=held' "$RUNNER_TEMP/m11-installed.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_installed_export=passed cancelled=true overlap=held written=true restored=true' "$RUNNER_TEMP/m11-installed.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_installed_verify=passed source_absent=true wrong_unlock=held wrong_checkpoint=held damaged=held cancelled=true' "$RUNNER_TEMP/m11-installed.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_separate_files=passed archived_bytes=identical replacement=independent both_notes=restored missing=held swapped=held source=lost' "$RUNNER_TEMP/m11-installed.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_installed_codec=passed public_recipient=true restored_with_daemon_signature=true' "$RUNNER_TEMP/m11-installed.txt" >> "$GITHUB_STEP_SUMMARY"
          grep '^m11_installed_search=passed launches=2 archive=true replacement=true reader=cryptexd canonical=unchanged$' "$RUNNER_TEMP/m11-installed.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_offline_backup_target=passed capture=committed search=reopened backup=unchanged' "$RUNNER_TEMP/m11-installed.txt" >> "$GITHUB_STEP_SUMMARY"

name: M11 backup container
on:
  workflow_dispatch:
  push:
    paths:
      - 'services/cryptexd/src/backup_scheduler.rs'
      - 'tools/m11-backup-spike/**'
      - 'apps/desktop/src/**'
      - 'apps/desktop/src-tauri/src/**'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - 'apps/desktop/src-tauri/tauri*.json'
      - 'services/cryptexd/Cargo.toml'
      - 'apps/desktop/scripts/recovered-search.test.mjs'
      - 'services/cryptexd/src/ipc.rs'
      - 'services/cryptexd/src/main.rs'
      - 'services/cryptexd/src/secure_store/**'
      - 'services/cryptexd/src/knowledge_materialization/recovered_search.rs'
      - 'services/cryptexd/src/ipc/recovered_desktop.rs'
      - 'services/cryptexd/src/knowledge_materialization/m11_backup_read.rs'
      - 'services/cryptexd/src/knowledge_materialization/m11_first_device.rs'
      - 'services/cryptexd/src/knowledge_materialization/m11_restarted_search.rs'
      - 'services/cryptexd/src/knowledge_materialization/pairing_recovery_tests.rs'
      - '.github/workflows/m11-backup-spike.yml'
      - 'crates/events/tests/fixtures/m8-old-reader-v1-v3.json'
      - '.node-version'
  pull_request:
    paths:
      - 'services/cryptexd/src/backup_scheduler.rs'
      - 'tools/m11-backup-spike/**'
      - 'apps/desktop/src/**'
      - 'apps/desktop/src-tauri/src/**'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - 'apps/desktop/src-tauri/tauri*.json'
      - 'services/cryptexd/Cargo.toml'
      - 'apps/desktop/scripts/recovered-search.test.mjs'
      - 'services/cryptexd/src/ipc.rs'
      - 'services/cryptexd/src/main.rs'
      - 'services/cryptexd/src/secure_store/**'
      - 'services/cryptexd/src/knowledge_materialization/recovered_search.rs'
      - 'services/cryptexd/src/ipc/recovered_desktop.rs'
      - 'services/cryptexd/src/knowledge_materialization/m11_backup_read.rs'
      - 'services/cryptexd/src/knowledge_materialization/m11_first_device.rs'
      - 'services/cryptexd/src/knowledge_materialization/m11_restarted_search.rs'
      - 'services/cryptexd/src/knowledge_materialization/pairing_recovery_tests.rs'
      - '.github/workflows/m11-backup-spike.yml'
      - 'crates/events/tests/fixtures/m8-old-reader-v1-v3.json'
      - '.node-version'

permissions:
  contents: read
jobs:
  rehearsal:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix tools/m11-backup-spike --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cryptex/desktop build
      - run: python -B tools/m11-backup-spike/rehearse.py
      - name: Verify atomic restore publication and retry
        run: python -B tools/m11-backup-spike/test_restore_publication.py
      - name: Verify recovered notes and attachments through guarded daemon reads
        shell: bash
        env:
          CRYPTEX_M11_DESKTOP_BROWSER: "1"
          CRYPTEX_M8_LOCAL_STARTUP_CERT_DER: ${{ github.workspace }}/services/cryptexd/src/m8_owner_channel/release_inventory/fixtures/signer.der
        run: |
          set -euo pipefail
          features=()
          if [[ "$RUNNER_OS" == macOS ]]; then features=(--features m8-local-startup-check); fi
          cargo clippy --locked -p cryptexd --lib --tests "${features[@]}" -- -D warnings
          cargo test --locked -p cryptexd --lib "${features[@]}" \
            knowledge_materialization::pairing_recovery_tests::m11_backup_read::next_backup_restores_the_offline_capture_after_reconnection \
            -- --exact --ignored --nocapture | tee "$RUNNER_TEMP/m11-next-backup.txt"
          grep -Fx 'm11_reconnected_backup=passed generations=2 original=preserved offline_capture=restored receipt=matched' "$RUNNER_TEMP/m11-next-backup.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_scheduled_reconnect=passed designated=published peer=skipped offline_capture=restored' "$RUNNER_TEMP/m11-next-backup.txt" >> "$GITHUB_STEP_SUMMARY"
          cargo test --locked -p cryptexd --lib "${features[@]}" \
            knowledge_materialization::pairing_recovery_tests::m11_backup_read::restored_note_and_attachment_pass_guarded_reads \
            -- --exact --ignored --nocapture | tee "$RUNNER_TEMP/m11-daemon-read.txt"
          grep '^m11_guarded_restore=passed ' "$RUNNER_TEMP/m11-daemon-read.txt" >> "$GITHUB_STEP_SUMMARY"
          grep '^m11_first_device=passed ' "$RUNNER_TEMP/m11-daemon-read.txt" >> "$GITHUB_STEP_SUMMARY"
          grep '^m11_restarted_search=passed ' "$RUNNER_TEMP/m11-daemon-read.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_offline_backup_target=passed capture=committed search=reopened backup=unchanged' "$RUNNER_TEMP/m11-daemon-read.txt" >> "$GITHUB_STEP_SUMMARY"
          grep '^m11_desktop_search=passed ' "$RUNNER_TEMP/m11-daemon-read.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Install the isolated Desktop and search in two fresh WebView sessions
        shell: bash
        env:
          CRYPTEX_M8_LOCAL_STARTUP_CERT_DER: ${{ github.workspace }}/services/cryptexd/src/m8_owner_channel/release_inventory/fixtures/signer.der
        run: |
          set -euo pipefail
          python -B tools/m11-backup-spike/installed_desktop.py install | tee "$RUNNER_TEMP/m11-installed.txt"
          grep '^m11_installed_search=passed launches=2 archive=true replacement=true reader=cryptexd canonical=unchanged$' "$RUNNER_TEMP/m11-installed.txt" >> "$GITHUB_STEP_SUMMARY"
          grep -Fx 'm11_offline_backup_target=passed capture=committed search=reopened backup=unchanged' "$RUNNER_TEMP/m11-installed.txt" >> "$GITHUB_STEP_SUMMARY"

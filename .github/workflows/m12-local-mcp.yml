name: M12 local MCP
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/local-mcp/**'
      - 'services/cryptexd/src/ipc.rs'
      - 'services/cryptexd/src/ipc/m12_health_tests.rs'
      - 'services/cryptexd/src/ipc/public_context.rs'
      - 'services/cryptexd/src/ipc/public_consent.rs'
      - 'apps/desktop/src/PublicReadReview.tsx'
      - 'apps/desktop/scripts/public-consent.test.mjs'
      - 'apps/desktop/scripts/codex-mcp-client.mjs'
      - 'services/cryptexd/src/knowledge_materialization/ai_context.rs'
      - '.github/workflows/m12-local-mcp.yml'
  pull_request:
    paths:
      - 'tools/local-mcp/**'
      - 'services/cryptexd/src/ipc.rs'
      - 'services/cryptexd/src/ipc/m12_health_tests.rs'
      - 'services/cryptexd/src/ipc/public_context.rs'
      - 'services/cryptexd/src/ipc/public_consent.rs'
      - 'apps/desktop/src/PublicReadReview.tsx'
      - 'apps/desktop/scripts/public-consent.test.mjs'
      - 'apps/desktop/scripts/codex-mcp-client.mjs'
      - 'services/cryptexd/src/knowledge_materialization/ai_context.rs'
      - '.github/workflows/m12-local-mcp.yml'

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --prefix tools/local-mcp --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cryptex/desktop build
      - name: Install the packaged bridge and pinned SDK client outside the checkout
        shell: pwsh
        run: |
          cd tools/local-mcp
          npm pack --pack-destination "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = Join-Path $env:RUNNER_TEMP 'm12-installed'
          npm install --prefix "$installed" --ignore-scripts (Join-Path $env:RUNNER_TEMP 'cryptex-local-mcp-0.0.0.tgz')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "M12_INSTALLED_STDIO=$(Join-Path $installed 'node_modules/cryptex-local-mcp/stdio.mjs')" >> $env:GITHUB_ENV
      - name: Install the pinned native Codex client
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'm12-codex'
          npm install --prefix "$install" --ignore-scripts --include=optional @openai/codex@0.155.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $name = if ($IsWindows) { 'codex.exe' } else { 'codex' }
          $native = @(Get-ChildItem -LiteralPath "$install/node_modules/@openai" -Recurse -File -Filter $name | Where-Object { $_.Directory.Name -eq 'bin' })
          if ($native.Count -ne 1) { throw 'Expected one native Codex executable' }
          $binary = $native[0].FullName
          if ((& $binary --version) -ne 'codex-cli 0.155.1') { throw 'Unexpected Codex version' }
          "M12_CODEX_BIN=$binary" >> $env:GITHUB_ENV
      - run: cargo fmt --all -- --check
      - name: Exercise stdio and the native daemon dispatcher in a disposable profile
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p cryptexd --lib ipc::public_consent::tests::
          cargo test --locked -p cryptexd --lib ipc::m12_health_tests:: -- --ignored --nocapture | tee "$RUNNER_TEMP/m12-stdio.txt"
          grep -F '3 passed; 0 failed' "$RUNNER_TEMP/m12-stdio.txt"

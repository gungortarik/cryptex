name: M8 Windows live worker and product receive
on:
  workflow_dispatch:
  push:
    branches: [codex/m8-device-trust]
    paths:
      - services/cryptexd/src/managed_profile/native_xml/exchange/tests.rs
      - services/cryptexd/src/managed_profile/worker.rs
      - services/cryptexd/src/managed_profile/worker/**
      - services/cryptexd/src/managed_profile/connection_settings/**
      - services/cryptexd/src/managed_profile/incoming.rs
      - services/cryptexd/src/managed_profile/incoming/**
      - services/cryptexd/src/ipc.rs
      - services/cryptexd/src/incoming_publication_tests.rs
      - services/cryptexd/src/managed_profile/native_product_receive_test.rs
      - services/cryptexd/src/managed_profile/native_product_receive_test/**
      - services/cryptexd/src/managed_profile/sealed_export.rs
      - services/cryptexd/src/managed_profile/sealed_export/**
      - services/cryptexd/src/import_staging/windows_inbox.rs
      - services/cryptexd/src/canonical_writer.rs
      - scripts/m8/run-daemon-tests-standard-user-ci.ps1
      - scripts/m8/standard-user-daemon-child.ps1
      - .github/workflows/m8-windows-live-worker.yml
permissions:
  contents: read
jobs:
  mac-canonical-lock:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Verify owner restriction and redelivery after restart on disposable macOS profiles
        shell: bash
        run: |
          set -euo pipefail
          export CRYPTEX_M8_LOCAL_STARTUP_CERT_DER="$RUNNER_TEMP/restriction-test.der"
          openssl req -new -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=Cryptex disposable restriction CI/' \
            -keyout /dev/null -outform DER -out "$CRYPTEX_M8_LOCAL_STARTUP_CERT_DER"
          test_name=incoming_publication::tests::offline_restricted_peer_tail_is_refused_after_owner_confirmed_cutoff
          cargo test --locked -p cryptexd --features m8-local-startup-check --lib "$test_name" -- --exact | tee "$RUNNER_TEMP/restriction-test.log"
          grep -Fx "test $test_name ... ok" "$RUNNER_TEMP/restriction-test.log"
          test_name=managed_profile::connection_settings::backend::tests::closed_worker_cannot_leave_a_restricted_peer_in_settings
          cargo test --locked -p cryptexd --features m8-local-startup-check --lib "$test_name" -- --exact | tee "$RUNNER_TEMP/restricted-roster.log"
          grep -Fx "test $test_name ... ok" "$RUNNER_TEMP/restricted-roster.log"
          test_name=managed_profile::sealed_export::tests::retirement_relay::interrupted_self_retirement_reaches_third_profile_after_first_owner_goes_offline
          cargo test --locked -p cryptexd --features m8-local-startup-check --lib "$test_name" -- --exact | tee "$RUNNER_TEMP/retirement-test.log"
          grep -Fx "test $test_name ... ok" "$RUNNER_TEMP/retirement-test.log"
          cargo test --locked -p cryptexd --features m8-local-startup-check --lib confirmed_self_retirement
      - name: Verify canonical lock contention and writer regression on macOS
        run: |
          cargo test --locked -p cryptexd --lib canonical_writer::tests:: -- --test-threads=1
          cargo test --locked -p cryptexd --lib ipc::tests::background_refresh_keeps_one_busy_request_and_respects_a_hold -- --exact
      - run: cargo clippy --locked -p cryptexd --lib -- -D warnings
  product-receive:
    uses: ./.github/workflows/m8-peer-recovery.yml
  native-worker:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Prepare pinned native package outside checkout
        run: python scripts/m8/prepare_native_test_package.py
      - name: Exercise real owned worker while exporting and revoking
        shell: pwsh
        run: ./scripts/m8/run-daemon-tests-standard-user-ci.ps1 -ExchangeNativeOnly -ExchangePackage "$env:RUNNER_TEMP/exchange-package"

name: M17 disposable personal-device signing
on:
  workflow_dispatch:
  push:
    branches: ['codex/m17-release-candidate']
    paths:
      - '.github/workflows/m17-owner-signing.yml'
      - 'scripts/m17/mac_package_signing.py'
      - 'scripts/m14/release_smoke.py'
      - 'scripts/m8/*standard-user*.ps1'
      - 'scripts/m17/windows_package_signing.ps1'
      - 'scripts/m17/owner_transport.py'
      - 'third_party/syncthing/2.1.7/**'
      - 'scripts/m17/build_owner_windows_installer.ps1'
      - 'scripts/m17/verify_first_install_*'
      - 'scripts/m17/check_installed_provenance.py'
      - 'apps/desktop/scripts/build-provenance*'
      - 'apps/desktop/scripts/prepare-cryptexd-sidecar.mjs'
      - 'third_party/rust-notices/**'
      - 'apps/desktop/scripts/*notices*'
      - 'apps/desktop/src-tauri/tauri.bundle.conf.json'
      - 'apps/desktop/src-tauri/tauri.conf.json'
      - 'scripts/m8/test_mac_local_signing_ci.py'
permissions:
  contents: read
jobs:
  signed-package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: node --test apps/desktop/scripts/rust-notices.test.mjs
      - run: node --test apps/desktop/scripts/build-provenance.test.mjs
      - if: runner.os == 'macOS'
        run: |
          python -B scripts/m8/test_mac_local_signing_runner.py
          pnpm --filter @cryptex/desktop tauri:package --bundles app
          python -B scripts/m17/mac_package_signing.py
      - name: Build the unsigned Windows binaries
        if: runner.os == 'Windows'
        run: pnpm --filter @cryptex/desktop tauri:package-smoke
      - name: Sign the Windows installer and inspect the installed images
        if: runner.os == 'Windows'
        timeout-minutes: 12
        shell: pwsh
        run: ./scripts/m17/windows_package_signing.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: signed-installed-startup-${{ runner.os }}
          path: ${{ runner.temp }}/m17-signed-startup.json
          if-no-files-found: error

name: M9 historical reader check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m9-reader-rollback.yml'
      - 'services/cryptexd/src/attachment_blobs/tests/signed_link.rs'
      - 'services/cryptexd/src/attachment_blobs/tests/signed_link/**'
      - 'services/cryptexd/src/instance.rs'
      - 'services/cryptexd/src/instance/**'
      - 'services/cryptexd/src/main.rs'
      - 'services/cryptexd/src/import_staging/export_fs.rs'
      - 'services/cryptexd/src/import_staging.rs'
      - 'services/cryptexd/src/import_staging/*inbox.rs'
      - 'services/cryptexd/src/managed_profile/sealed_export.rs'
      - 'services/cryptexd/src/managed_profile/sealed_export/**'
      - 'services/cryptexd/src/managed_profile/connection_settings/backend.rs'
      - 'services/cryptexd/src/managed_profile/incoming.rs'
      - 'services/cryptexd/src/managed_profile/mod.rs'
      - 'services/cryptexd/src/test_temp.rs'
      - 'services/cryptexd/src/knowledge_materialization.rs'
      - 'services/cryptexd/src/knowledge_materialization/export_plan.rs'
      - 'services/cryptexd/src/import_staging/macos_fs.rs'
      - 'services/cryptexd/src/platform/instance_file.rs'
      - 'scripts/m8/*standard-user*'
      - 'scripts/m8/prepare_native_test_package.py'
      - 'services/cryptexd/src/managed_profile/native_product_receive_test/reader_preflight.rs'
      - 'services/cryptexd/src/compat.rs'
permissions:
  contents: read
jobs:
  reader:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2efc3dd60ce4acd67cc84bd4056973eae5b29a86
          path: m8
          persist-credentials: false
      - name: Build the unmodified pre-M9 daemon
        working-directory: m8
        run: cargo build --locked -p cryptexd --bin cryptexd
      - name: Prepare pinned native worker for paired Windows profiles
        if: runner.os == 'Windows'
        run: python scripts/m8/prepare_native_test_package.py
      - name: Verify reader preflight and M8 denial under a standard Windows account
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked -p cryptexd --bin cryptexd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/m8/run-daemon-tests-standard-user-ci.ps1 -M9HistoricalDaemon (Resolve-Path 'm8/target/debug/cryptexd.exe').Path -ExchangePackage "$env:RUNNER_TEMP/exchange-package" | Tee-Object -FilePath rollback-observation.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = @(Select-String -Path rollback-observation.txt -Pattern '^historical_profile_lock=denied ')
          if ($receipt.Count -ne 1) { throw 'Missing historical denial receipt.' }
          $receipt[0].Line >> $env:GITHUB_STEP_SUMMARY
          $migration = @(Select-String -Path rollback-observation.txt -Pattern '^existing_profile_migration=verified ')
          if ($migration.Count -ne 1) { throw 'Missing profile migration receipt.' }
          $migration[0].Line >> $env:GITHUB_STEP_SUMMARY
      - name: Verify M8 denial on the controlled Mac product path
        if: runner.os == 'macOS'
        env:
          CRYPTEX_M9_PREVIOUS_DAEMON: ${{ github.workspace }}/m8/target/debug/cryptexd
          CRYPTEX_M9_CANDIDATE_DAEMON: ${{ github.workspace }}/target/debug/cryptexd
          CRYPTEX_M8_DEVELOPMENT_CERT_DER: ${{ github.workspace }}/services/cryptexd/src/m8_owner_channel/release_inventory/fixtures/signer.der
          CRYPTEX_M8_DEVELOPMENT_RELEASE_ID: cryptex-dev-attachment-ci
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p cryptexd --bin cryptexd --features m8-development-product
          cargo test --locked -p cryptexd --features m8-development-product --lib attachment_blobs::tests::signed_link::audit_pre_m9_profile_admission -- --ignored --exact --nocapture | tee rollback-observation.txt
          grep '^historical_profile_lock=denied ' rollback-observation.txt >> "$GITHUB_STEP_SUMMARY"
          grep '^existing_profile_migration=verified ' rollback-observation.txt >> "$GITHUB_STEP_SUMMARY"
          export CRYPTEX_M9_READER_ATTEMPT=$(python3 -c 'import uuid; print(uuid.uuid4().hex)')
          cargo test --locked -p cryptexd --features m8-development-product --lib managed_profile::sealed_export::reader::
          for phase in write reopen; do
            CRYPTEX_M9_OBSERVATION_PHASE="$phase" cargo test --locked -p cryptexd --features m8-development-product --lib managed_profile::native_observation_survives_process_exit -- --exact --ignored | tee native-reader.txt
            grep -F '1 passed; 0 failed; 0 ignored' native-reader.txt >> "$GITHUB_STEP_SUMMARY"
          done
          cargo test --locked -p cryptexd --features m8-development-product --lib managed_profile::sealed_export::tests::reader_preflight:: -- --nocapture | tee preflight.txt
          grep -F '5 passed; 0 failed; 0 ignored' preflight.txt >> "$GITHUB_STEP_SUMMARY"

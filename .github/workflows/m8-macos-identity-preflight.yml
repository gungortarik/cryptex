name: M8 Mac identity prerequisite harness
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  bootstrap-mechanism:
    uses: ./.github/workflows/m8-macos-bootstrap-mechanism.yml
  prerequisites:
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify prerequisite collector, privacy and process bounds
        run: |
          bash -n scripts/m8/MAC-KIMLIK.command
          bash -n scripts/m8/MAC-IMZA.command
          bash -n scripts/m8/MAC-SUREC.command
          bash -n scripts/m8/MAC-BAGLANTI.command
          python3 -m unittest discover -s scripts/m8 -p test_mac_identity_preflight.py -v
          python3 -m unittest discover -s scripts/m8 -p test_mac_xpc_probe.py -v
          python3 -m unittest discover -s scripts/m8 -p test_mac_peer_api_audit.py -v
          python3 -m unittest discover -s scripts/m8 -p test_mac_message_identity.py -v
          python3 -m unittest discover -s scripts/m8 -p test_mac_launch_security.py -v
      - name: Verify candidate build and explicit ad-hoc self refusal only
        run: python3 -B scripts/m8/mac_launch_security.py --package scripts/m8 --ci
      - name: Audit supported public peer-identity SDK surface without private headers
        run: python3 -B scripts/m8/mac_peer_api_audit.py
      - name: Probe actual raw Mach message sender generation with public audit getters
        run: python3 -B scripts/m8/mac_message_identity.py --package scripts/m8 --ci
      - name: Compile synthetic XPC source and exercise anonymous same-process smoke
        run: |
          xcrun --sdk macosx clang -std=c11 -fblocks -Wall -Wextra -Werror -mmacosx-version-min=12.0 -isysroot "$(xcrun --sdk macosx --show-sdk-path)" scripts/m8/mac_xpc_probe.c -framework Security -framework CoreFoundation -o "$RUNNER_TEMP/xpc-synthetic"
          codesign --force --timestamp=none --sign - --identifier com.cryptex.m8.ci.synthetic "$RUNNER_TEMP/xpc-synthetic"
          "$RUNNER_TEMP/xpc-synthetic" self-smoke 'identifier "com.cryptex.m8.ci.synthetic"'
          # CI ad-hoc/self-process smoke is not the owner's signed cross-process matrix.
      - name: Exercise cross-process synthetic XPC and endpoint courier on disposable CI
        run: python3 -B scripts/m8/mac_xpc_ci_smoke.py
      - name: Package exact source outside checkout and run API prerequisites only
        run: |
          python3 scripts/m8/package-macos-identity.py --output "$RUNNER_TEMP/mac-identity.zip"
          mkdir "$RUNNER_TEMP/mac-identity-package"
          unzip -q "$RUNNER_TEMP/mac-identity.zip" -d "$RUNNER_TEMP/mac-identity-package"
          CRYPTEX_MAC_PREFLIGHT_HEADLESS=1 bash "$RUNNER_TEMP/mac-identity-package/MAC-KIMLIK.command"
          # The collector reports missing signing prerequisites truthfully;
          # this workflow does not run/approve the signed XPC matrix.
      - name: Diagnose public API compilation on disposable CI host only
        if: failure()
        run: |
          # Only this fixed public source is compiled; never print keychain inventory.
          xcrun --sdk macosx clang -std=c11 -fblocks -Wall -Wextra -Werror -mmacosx-version-min=12.0 -isysroot "$(xcrun --sdk macosx --show-sdk-path)" scripts/m8/mac_identity_api.c -framework Security -framework CoreFoundation -o "$RUNNER_TEMP/api-availability-diagnostic"

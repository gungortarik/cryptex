name: M17 official transport inspection
on:
  workflow_dispatch:
    inputs:
      owner_release:
        description: Compare the selected owner release to both packaging inputs
        type: boolean
        default: false
  push:
    branches: ['codex/m17-release-candidate']
    paths:
      - '.github/workflows/m17-official-transport.yml'
      - 'scripts/m17/scan_transport.py'
      - 'scripts/m17/test_scan_transport.py'
      - 'scripts/m17/transport_notices.py'
      - 'scripts/m17/test_transport_notices.py'
      - 'scripts/m17/owner_transport.py'
      - 'third_party/syncthing/**'
permissions:
  contents: read
jobs:
  inspect-official-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s scripts/m17 -p 'test_scan_transport.py' -v
      - run: python -B -m unittest discover -s scripts/m17 -p 'test_transport_notices.py' -v
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - name: Compare archive digests and inspect both binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/m17/scan_transport.py "$RUNNER_TEMP/transport.json" ${{ (github.event_name == 'push' || inputs.owner_release) && '--owner-release' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: official-transport-inspection
          path: ${{ runner.temp }}/transport.json
          if-no-files-found: error
      - name: Compare linked module sources and collect their exact notices
        id: notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/m17/transport_notices.py "$RUNNER_TEMP/transport.json" "$RUNNER_TEMP/linked-notices.json" "$RUNNER_TEMP/distribution-notices" ${{ (github.event_name == 'push' || inputs.owner_release) && '--verify-owner' || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && (steps.notices.outcome == 'success' || steps.notices.outcome == 'failure') }}
        with:
          name: official-transport-linked-notices
          path: ${{ runner.temp }}/linked-notices.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: official-transport-distribution-notices
          path: ${{ runner.temp }}/distribution-notices/*.txt
          if-no-files-found: error

name: M8 Mac descriptor budget reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download pinned previously tested native artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43671787980 --repo gungortarik/cryptex --name mac-interactive-ui --dir "$RUNNER_TEMP/fd-artifact"
      - name: Reproduce with a bounded process descriptor budget
        run: python3 -B scripts/m8/mac_fd_repro.py "$RUNNER_TEMP/fd-artifact/cryptex-mac-transport.zip" "$RUNNER_TEMP/fd-repro"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-fd-repro
          path: ${{ runner.temp }}/fd-repro/*.json
          retention-days: 2

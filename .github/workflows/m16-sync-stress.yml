name: M16 repeated offline sync
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/m16-sync-stress.yml'
      - 'scripts/m16/sync_stress.py'
      - 'services/cryptexd/src/managed_profile/sealed_export/tests/reader_preflight/transfer/stress.rs'
permissions:
  contents: read
jobs:
  native-pair:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'macOS'
        run: python3 -B scripts/m16/sync_stress.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packet = Join-Path $env:RUNNER_TEMP 'm16-native'
          python -B scripts/m8/test_lan_cutoff_pair.py --build-windows "$packet"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/m8/run-daemon-tests-standard-user-ci.ps1 -M16SyncStress -LanArtifact "$packet"

name: M16 repeated offline sync
on:
  workflow_dispatch:
  push:
    paths:
      - 'Cargo.lock'
      - 'crates/projection/src/**'
      - 'services/cryptexd/Cargo.toml'
      - '.github/workflows/m16-sync-stress.yml'
      - 'scripts/m16/sync_stress.py'
      - 'scripts/m16/owner_soak.py'
      - 'scripts/m16/package_soak.py'
      - 'scripts/m16/suspend_clock.py'
      - 'scripts/m16/test_suspend_clock.py'
      - 'services/cryptexd/src/managed_profile/sealed_export/tests/reader_preflight/transfer/stress.rs'
permissions:
  contents: read
jobs:
  native-pair:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
      - run: python -B scripts/m16/test_suspend_clock.py -v
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/m16-packet.zip"
          python3 -B scripts/m16/package_soak.py "$packet"
          unzip -q "$packet" -d "$RUNNER_TEMP/m16-extracted"
          python3 -B "$RUNNER_TEMP/m16-extracted/Cryptex-M16/scripts/m16/owner_soak.py" --smoke
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packet = Join-Path $env:RUNNER_TEMP 'm16-native'
          python -B scripts/m8/test_lan_cutoff_pair.py --build-windows "$packet"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $env:RUNNER_TEMP 'm16-packet.zip'
          python -B scripts/m16/package_soak.py "$archive" --windows-artifact "$packet"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unpacked = Join-Path $env:RUNNER_TEMP 'm16-extracted'
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          ./scripts/m8/run-daemon-tests-standard-user-ci.ps1 -M16SyncStress -LanArtifact (Join-Path $unpacked 'Cryptex-M16')
      - uses: actions/upload-artifact@v4
        with:
          name: m16-soak-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/m16-packet.zip
          if-no-files-found: error

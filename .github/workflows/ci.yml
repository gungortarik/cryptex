name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    name: Readiness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Verify toolchain versions
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify desktop dependency baseline
        run: |
          pnpm --filter @cryptex/desktop exec tauri --version
          pnpm --filter @cryptex/desktop exec tsc --version
          pnpm --filter @cryptex/desktop exec vite --version

      - name: Build desktop frontend
        run: pnpm --filter @cryptex/desktop build

      - name: Validate Cargo workspace manifest
        run: cargo metadata --format-version 1 --no-deps

      - name: Check Rust workspace
        run: cargo check --workspace

      - name: Capture generated Cargo lockfile
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: m0-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1

      - name: Test M0 storage benchmark harness
        run: cargo test -p m0-storage-bench

      - name: Run cryptexd foundation binary
        run: cargo run -p cryptexd --quiet

      # M0 will add format, lint, schema, Golden Brain,
      # packaging and failure-path checks as those targets exist.

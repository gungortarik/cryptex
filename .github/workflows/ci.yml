name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      desktop_startup_only:
        description: Run scoped Desktop startup/restart tests and native Desktop lint on both platforms
        type: boolean
        default: false
      mac_ui_source:
        description: Optional full product commit for the signed interactive Mac fixture in desktop_startup_only mode
        type: string
      mac_identity_preflight_only:
        description: Run only Mac prerequisite and synthetic XPC harness checks
        type: boolean
        default: false
      ipc_acl_only:
        description: Run only the isolated Windows cross-account IPC test
        type: boolean
        default: false
      windows_desktop_build_only:
        description: Build only the unsigned Windows Desktop NSIS package and upload artifacts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop-startup:
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_startup_only
    name: Desktop startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.mac_ui_source || github.sha }}
          persist-credentials: false
      - name: Check out interactive fixture tooling
        if: runner.os == 'macOS' && inputs.mac_ui_source != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ui-tools
          sparse-checkout: scripts/m8
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned toolchain and frontend
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          pnpm install --frozen-lockfile
          pnpm --filter @cryptex/desktop build
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint changed daemon and Desktop paths
        run: cargo clippy --locked -p cryptexd -p cryptex-desktop --all-targets -- -D warnings
      - name: Verify native Mac frame and right ownership
        if: runner.os == 'macOS'
        run: sh scripts/m8/test-mac-owner-native.sh
      - name: Test local certificate native exchange and actual signed startup
        if: runner.os == 'macOS'
        env:
          CRYPTEX_UI_SOURCE: ${{ inputs.mac_ui_source }}
        run: |
          if [[ -n "$CRYPTEX_UI_SOURCE" ]]; then
            [[ "$(git rev-parse HEAD)" == "$CRYPTEX_UI_SOURCE" ]] || exit 1
            python3 .ui-tools/scripts/m8/test_mac_local_signing_ci.py
          else
            python3 scripts/m8/test_mac_local_signing_ci.py
          fi
      - name: Test actual child startup, malformed readiness and crash restart
        if: runner.os != 'Windows'
        env:
          CRYPTEX_STARTUP_DISPOSABLE_ACCOUNT: '1'
        run: cargo test --locked -p cryptexd --test desktop_startup -- --include-ignored --test-threads=1
      - name: Verify Mac OS-store reload across separate daemon-library processes
        if: runner.os == 'macOS'
        run: |
          cargo test --locked -p cryptexd --lib platform_restart_tests:: -- --include-ignored --test-threads=1
      - name: Test startup with an actual standard-user Windows token
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/m8/run-daemon-tests-standard-user-ci.ps1 -DesktopStartupOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Desktop Rust foundation
        run: cargo test --locked -p cryptex-desktop
      - name: Test approval connection lifetime and Desktop response correlation
        if: runner.os != 'Windows'
        run: |
          cargo test --locked -p cryptexd --lib approval_session::tests:: -- --test-threads=1
          cargo test --locked -p cryptexd --lib ipc::tests::desktop_pending_ -- --test-threads=1
          cargo test --locked -p cryptexd --lib m8_owner_channel:: -- --test-threads=1
          cargo test --locked -p cryptexd --lib ipc::tests::mac_owner_channel_ -- --test-threads=1
          cargo test --locked -p cryptexd --lib ipc::tests:: -- --test-threads=1
          cargo test --locked -p cryptexd --lib runtime_admission::tests:: -- --test-threads=1
      - name: Test approval sessions with an actual standard-user Windows token
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/m8/test-standard-user-summary.ps1
          & ./scripts/m8/run-daemon-tests-standard-user-ci.ps1 -DesktopSessionOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload signed Mac UI test fixture
        if: success() && runner.os == 'macOS' && inputs.mac_ui_source != ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-interactive-ui
          path: |
            ${{ runner.temp }}/cryptex-mac-ui.zip
            ${{ runner.temp }}/cryptex-mac-durable.zip
          if-no-files-found: error
          retention-days: 1

  readiness:
    if: github.event_name != 'workflow_dispatch' || (!inputs.desktop_startup_only && !inputs.mac_identity_preflight_only && !inputs.ipc_acl_only && !inputs.windows_desktop_build_only)
    name: Readiness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Verify toolchain versions
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify desktop dependency baseline
        run: |
          pnpm --filter @cryptex/desktop exec tauri --version
          pnpm --filter @cryptex/desktop exec tsc --version
          pnpm --filter @cryptex/desktop exec vite --version

      - name: Build desktop frontend
        run: pnpm --filter @cryptex/desktop build

      - name: Test Desktop retrieval response policy
        run: pnpm --filter @cryptex/desktop test:search-policy

      - name: Validate Cargo workspace manifest
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Verify native Mac frame and right ownership
        if: runner.os == 'macOS'
        run: sh scripts/m8/test-mac-owner-native.sh

      - name: Check Rust workspace
        run: cargo check --locked --workspace

      - name: Test M0 storage benchmark harness
        run: cargo test --locked -p m0-storage-bench

      - name: Test M0 cryptexd lifecycle harness
        if: runner.os != 'Windows'
        run: cargo test --locked -p cryptexd

      - name: Test daemon with real standard-user ownership (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/m8/run-daemon-tests-standard-user-ci.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cryptexd --doc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test M2 event and storage crates
        run: cargo test --locked -p cryptex-events -p cryptex-storage

      - name: Test M3 projection crate
        run: cargo test --locked -p cryptex-projection

      - name: Test M4 knowledge reducer and SQLite recovery
        run: cargo test --locked -p cryptex-knowledge

      - name: Check M2 schema TypeScript drift
        run: pnpm --filter @cryptex/schemas check:drift

      - name: Test M0 lifecycle compare harness
        run: cargo test --locked -p m0-lifecycle-compare

      - name: Test M0 local IPC spike
        run: cargo test --locked -p m0-ipc-spike

      - name: Test Desktop Rust foundation
        run: cargo test --locked -p cryptex-desktop

      - name: Build native helpers for Node failure-path and Golden tests
        run: cargo build --locked -p m0-lifecycle-compare -p m0-storage-bench

      - name: Build embedded-frontend release Desktop for negative pre-Tauri CLI tests
        run: cargo build --locked --release -p cryptex-desktop --features tauri/custom-protocol

      - name: Test release Desktop namespace and frontend build mode
        run: cargo test --locked --release -p cryptex-desktop --features tauri/custom-protocol

      - name: Lint release-only Desktop paths
        run: cargo clippy --locked --release -p cryptex-desktop --features tauri/custom-protocol --all-targets -- -D warnings

      - name: Test Node foundation, recovery, packaging and Syncthing boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $desktopName = if ($IsWindows) { 'cryptex-desktop.exe' } else { 'cryptex-desktop' }
          $env:CRYPTEX_PILOT_DESKTOP_TEST_BINARY = Join-Path $env:GITHUB_WORKSPACE "target/release/$desktopName"
          $lifecycleTests = @(Get-ChildItem -LiteralPath 'tools/m0-lifecycle-compare/scripts' -Filter '*.test.mjs' -File | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($lifecycleTests.Count -eq 0) { throw 'Lifecycle test inventory missing' }
          node --test @lifecycleTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tools/m0-storage-bench/scripts/capture-syncthing-p0-1-raw-result.test.mjs apps/desktop/scripts/prepare-cryptexd-sidecar.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run cryptexd foundation binary
        run: cargo run --locked -p cryptexd --quiet

      # Physical native-host proofs and final human/ADR acceptance are retained
      # separately. These tests do not certify installed/signed distribution.

  ipc-acl:
    if: github.event_name != 'workflow_dispatch' || (!inputs.desktop_startup_only && !inputs.mac_identity_preflight_only && !inputs.windows_desktop_build_only)
    name: IPC cross-account ACL (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Build IPC candidate
        run: cargo build --locked -p m0-ipc-spike

      - name: Verify actual different-user access denial
        run: |
          powershell.exe -NoProfile -NonInteractive -File tools/m0-ipc-spike/scripts/test-windows-ipc-acl-ci.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  mac-identity-preflight:
    if: github.event_name == 'workflow_dispatch' && !inputs.desktop_startup_only && inputs.mac_identity_preflight_only
    uses: ./.github/workflows/m8-macos-identity-preflight.yml

  windows-desktop-build:
    if: github.event_name == 'workflow_dispatch' && !inputs.desktop_startup_only && !inputs.mac_identity_preflight_only && inputs.windows_desktop_build_only
    name: Windows Desktop package (unsigned, manual only)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check sidecar staging
        run: pnpm --dir apps/desktop test:sidecar-build-script

      - name: Build unsigned NSIS package
        run: pnpm --filter @cryptex/desktop tauri:package --bundles nsis

      - name: Test release Desktop path and status helpers
        run: cargo test -p cryptex-desktop --bin cryptex-desktop --release --locked

      - name: Stage artifacts with provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'cryptex-windows-package'
          New-Item -ItemType Directory -Path $artifactRoot | Out-Null
          Copy-Item -LiteralPath 'target/release/cryptex-desktop.exe' -Destination $artifactRoot
          Copy-Item -LiteralPath 'apps/desktop/src-tauri/binaries/cryptexd-x86_64-pc-windows-msvc.exe' -Destination (Join-Path $artifactRoot 'cryptexd.exe')
          $installers = @(Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'NSIS installer missing' }
          foreach ($installer in $installers) {
            Copy-Item -LiteralPath $installer.FullName -Destination $artifactRoot
          }
          $files = @(Get-ChildItem -LiteralPath $artifactRoot -File | ForEach-Object {
            [ordered]@{ name = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash; bytes = $_.Length }
          })
          [ordered]@{
            source_commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            target = 'x86_64-pc-windows-msvc'
            signing = 'unsigned development artifact; not release acceptance'
            files = $files
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $artifactRoot 'provenance.json') -Encoding utf8NoBOM

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: cryptex-windows-package-${{ github.sha }}
          path: ${{ runner.temp }}/cryptex-windows-package/
          if-no-files-found: error
          retention-days: 7

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mac_keychain_diagnostic_only:
        description: Test exact synthetic CI Keychain permissions and startup using pinned signed images
        type: boolean
        default: false
      mac_window_collector_only:
        description: Test isolated collectors and LAN setup tooling; no application acceptance
        type: boolean
        default: false
      mac_fd_repro_only:
        description: Reproduce owner import using pinned signed Mac artifact and 256 descriptor ceiling
        type: boolean
        default: false
      mac_import_diagnostics_only:
        description: Run only bounded Darwin import filesystem and capture concurrency diagnostics; not release acceptance
        type: boolean
        default: false
      schema_candidate_only:
        description: Generate and validate candidate M8 protocol schemas on both native platforms
        type: boolean
        default: false
      desktop_startup_only:
        description: Run scoped Desktop startup/restart tests and native Desktop lint on both platforms
        type: boolean
        default: false
      mac_ui_source:
        description: Optional full product commit for the signed interactive Mac fixture in desktop_startup_only mode
        type: string
      mac_identity_preflight_only:
        description: Run only Mac prerequisite and synthetic XPC harness checks
        type: boolean
        default: false
      ipc_acl_only:
        description: Run only the isolated Windows cross-account IPC test
        type: boolean
        default: false
      windows_desktop_build_only:
        description: Build only the unsigned Windows Desktop NSIS package and upload artifacts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mac-keychain-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.mac_keychain_diagnostic_only
    permissions:
      contents: read
      actions: read
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test metadata output boundary
        run: |
          python3 -B -m unittest discover -s scripts/m8 -p 'test_mac_keychain_item_ci.py' -v
          python3 -B -m unittest discover -s scripts/m8 -p 'test_mac_ci_credential*.py' -v
      - name: Download pinned development images
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43759501863 --repo gungortarik/cryptex --name mac-development-diagnostic --dir "$RUNNER_TEMP/keychain-artifact"
      - name: Test provisioned nonempty profile and exact cleanup
        run: python3 -B scripts/m8/mac_ci_existing_profile_only.py "$RUNNER_TEMP/keychain-artifact/cryptex-mac-development-diagnostic.zip"
  lan-setup-tools:
    if: github.event_name == 'workflow_dispatch' && inputs.mac_window_collector_only && !inputs.mac_keychain_diagnostic_only
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/m8-lan-setup-tools.yml
  mac-window-collector:
    if: github.event_name == 'workflow_dispatch' && inputs.mac_window_collector_only && !inputs.mac_keychain_diagnostic_only
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test collector and actual Darwin process groups without application or Keychain
        run: |
          /usr/bin/python3 -B -m unittest discover -s scripts/m8 -p 'test_mac_window*.py' -v
          /usr/bin/python3 -B -m unittest discover -s scripts/m8 -p 'test_mac_product_key_startup.py' -v
          /usr/bin/python3 -B -m unittest discover -s scripts/m8 -p 'test_mac_ci_credential*.py' -v
      - name: Compare read-only Keychain discovery with isolated HOME (no item access)
        run: /usr/bin/python3 -B scripts/m8/mac_keychain_context_check.py
  mac-fd-repro:
    if: github.event_name == 'workflow_dispatch' && inputs.mac_fd_repro_only && !inputs.mac_window_collector_only && !inputs.mac_keychain_diagnostic_only
    permissions:
      contents: read
      actions: read
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download pinned previously tested native artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43671787980 --repo gungortarik/cryptex --name mac-interactive-ui --dir "$RUNNER_TEMP/fd-artifact"
      - name: Reproduce with a bounded process descriptor budget
        run: python3 -B scripts/m8/mac_fd_repro.py "$RUNNER_TEMP/fd-artifact/cryptex-mac-transport.zip" "$RUNNER_TEMP/fd-repro"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-fd-repro
          path: ${{ runner.temp }}/fd-repro/*.json
          retention-days: 2

  mac-import-diagnostics:
    if: ${{ !inputs.mac_keychain_diagnostic_only && !inputs.mac_window_collector_only && !inputs.mac_fd_repro_only && github.event_name == 'workflow_dispatch' && inputs.mac_import_diagnostics_only }}
    name: Darwin import filesystem diagnostics
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check source formatting
        run: cargo fmt --all -- --check
      - name: Test actual concurrent Darwin directory and lock creation
        run: |
          cargo test --locked -p cryptexd --lib import_staging::macos_fs::tests:: -- --test-threads=1
      - name: Test actual concurrent canonical capture
        run: |
          cargo test --locked -p cryptexd --lib capture::tests::concurrent_matching_capture_ids_append_once -- --test-threads=1
      - name: Test filesystem adapters in the actual parallel daemon library context
        run: cargo test --locked -p cryptexd --lib

  schema-candidate:
    if: ${{ !inputs.mac_keychain_diagnostic_only && !inputs.mac_window_collector_only && !inputs.mac_fd_repro_only && !inputs.mac_import_diagnostics_only && (github.event_name == 'workflow_dispatch' && inputs.schema_candidate_only) }}
    uses: ./.github/workflows/m8-schema-candidate.yml
  desktop-startup:
    if: ${{ !inputs.mac_keychain_diagnostic_only && !inputs.mac_window_collector_only && !inputs.mac_fd_repro_only && !inputs.mac_import_diagnostics_only && (!inputs.schema_candidate_only && (github.event_name == 'workflow_dispatch' && inputs.desktop_startup_only)) }}
    name: Desktop startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Match the signed-fixture runner's existing profile from the first build;
    # avoid compiling every dependency twice with different debug-info settings.
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.mac_ui_source || github.sha }}
          persist-credentials: false
      - name: Check out interactive fixture tooling
        if: runner.os == 'macOS' && inputs.mac_ui_source != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ui-tools
          sparse-checkout: scripts/m8
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install pinned toolchain and frontend
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          pnpm install --frozen-lockfile
          pnpm --filter @cryptex/desktop build
      - name: Test connection settings wire and UI policy
        run: |
          pnpm --filter @cryptex/desktop test:connection-settings
          cargo test --locked -p cryptexd --lib managed_profile::connection_settings::tests:: -- --test-threads=1
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test public-Brain-only fixture isolation
        run: |
          cargo test --locked -p cryptexd --bin cryptexd brain_only_fixture -- --test-threads=1
          cargo test --locked -p cryptexd --bin cryptexd lan_profile_fixture -- --test-threads=1
          cargo test --locked -p cryptexd --lib empty_stream_fixture -- --test-threads=1
      - name: Test canonical transport eligibility
        run: |
          cargo test --locked -p cryptexd --lib managed_profile::exchange_policy:: -- --test-threads=1
          cargo test --locked -p cryptexd --lib managed_profile::native_xml::exchange:: -- --test-threads=1
      - name: Test Windows incoming controller and restricted-history replay
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/m8/test-standard-user-summary.ps1
          & ./scripts/m8/run-daemon-tests-standard-user-ci.ps1 -TransportPolicyOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows recoverable exchange persistence
        if: runner.os == 'Windows'
        run: |
          cargo test --locked -p cryptexd --lib managed_profile::exchange_install:: -- --test-threads=1
      - name: Test Windows transport admission lifetime
        if: runner.os == 'Windows'
        run: |
          cargo test --locked -p cryptexd --lib runtime_admission::tests:: -- --test-threads=1
      - name: Test Windows native profile and bootstrap refusal
        if: runner.os == 'Windows'
        run: |
          cargo test --locked -p cryptexd --lib managed_profile::native::tests:: -- --test-threads=1
      - name: Test Windows owned transport reader revocation
        if: runner.os == 'Windows'
        run: cargo test --locked -p cryptexd --lib managed_profile::worker::tests::transport_identity_is_available_only_for_an_active_ready_worker -- --test-threads=1
      - name: Lint changed daemon and Desktop paths
        run: cargo clippy --locked -p cryptexd -p cryptex-desktop --all-targets -- -D warnings
      - name: Verify native Mac frame and right ownership
        if: runner.os == 'macOS'
        run: sh scripts/m8/test-mac-owner-native.sh
      - name: Compile owner-local Keychain CMS signer
        if: runner.os == 'macOS'
        run: |
          clang -Wall -Wextra -Werror scripts/m8/mac_owner_cms.c services/cryptexd/src/m8_owner_channel/native/inventory.c -framework Security -framework CoreFoundation -o "$RUNNER_TEMP/owner-cms"
          python3 -B -m unittest discover -s scripts/m8 -p test_mac_lan_setup.py
          python3 -B -m unittest discover -s scripts/m8 -p test_mac_identity_preflight.py
      - name: Test local certificate native exchange and actual signed startup
        if: runner.os == 'macOS'
        env:
          CRYPTEX_UI_SOURCE: ${{ inputs.mac_ui_source }}
          CRYPTEX_DEVELOPMENT_DIAGNOSTIC_EXPORT: ${{ runner.temp }}/cryptex-mac-development-diagnostic.zip
        run: |
          if [[ -n "$CRYPTEX_UI_SOURCE" ]]; then
            [[ "$(git rev-parse HEAD)" == "$CRYPTEX_UI_SOURCE" ]] || exit 1
            python3 .ui-tools/scripts/m8/test_mac_local_signing_ci.py
          else
            python3 scripts/m8/test_mac_local_signing_ci.py
          fi
      - name: Upload failed development startup diagnostic
        if: always() && runner.os == 'macOS' && inputs.mac_ui_source == ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-development-diagnostic
          path: ${{ runner.temp }}/cryptex-mac-development-diagnostic.zip
          if-no-files-found: ignore
          retention-days: 1
      - name: Test actual child startup, malformed readiness and crash restart
        if: runner.os != 'Windows'
        env:
          CRYPTEX_STARTUP_DISPOSABLE_ACCOUNT: '1'
        run: cargo test --locked -p cryptexd --test desktop_startup -- --include-ignored --test-threads=1
      - name: Verify Mac OS-store reload across separate daemon-library processes
        if: runner.os == 'macOS'
        run: |
          cargo test --locked -p cryptexd --lib platform_restart_tests:: -- --include-ignored --test-threads=1
      - name: Test startup with an actual standard-user Windows token
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/m8/run-daemon-tests-standard-user-ci.ps1 -DesktopStartupOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Desktop Rust foundation
        run: cargo test --locked -p cryptex-desktop
      - name: Test credential send and observation lifetime boundaries
        run: |
          cargo test --locked -p cryptexd --lib syncthing_owned_rest::boundary_tests:: -- --test-threads=1
      - name: Test approval connection lifetime and Desktop response correlation
        if: runner.os != 'Windows'
        run: |
          cargo test --locked -p cryptexd --lib approval_session::tests:: -- --test-threads=1
          cargo test --locked -p cryptexd --lib ipc::tests::desktop_pending_ -- --test-threads=1
          cargo test --locked -p cryptexd --lib m8_owner_channel:: -- --test-threads=1
          cargo test --locked -p cryptexd --lib ipc::tests::mac_owner_channel_ -- --test-threads=1
          cargo test --locked -p cryptexd --lib ipc::tests:: -- --test-threads=1
          cargo test --locked -p cryptexd --lib runtime_admission::tests:: -- --test-threads=1
      - name: Test approval sessions with an actual standard-user Windows token
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/m8/test-standard-user-summary.ps1
          & ./scripts/m8/run-daemon-tests-standard-user-ci.ps1 -DesktopSessionOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload signed Mac UI test fixture
        if: success() && runner.os == 'macOS' && inputs.mac_ui_source != ''
        uses: actions/upload-artifact@v4
        with:
          name: mac-interactive-ui
          path: |
            ${{ runner.temp }}/cryptex-mac-ui.zip
            ${{ runner.temp }}/cryptex-mac-durable.zip
            ${{ runner.temp }}/cryptex-mac-transport.zip
            ${{ runner.temp }}/cryptex-mac-combined-loss.zip
          if-no-files-found: error
          retention-days: 1

  readiness:
    if: ${{ !inputs.mac_keychain_diagnostic_only && !inputs.mac_window_collector_only && !inputs.mac_fd_repro_only && !inputs.mac_import_diagnostics_only && (!inputs.schema_candidate_only && (github.event_name != 'workflow_dispatch' || (!inputs.desktop_startup_only && !inputs.mac_identity_preflight_only && !inputs.ipc_acl_only && !inputs.windows_desktop_build_only))) }}
    name: Readiness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Verify toolchain versions
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify desktop dependency baseline
        run: |
          pnpm --filter @cryptex/desktop exec tauri --version
          pnpm --filter @cryptex/desktop exec tsc --version
          pnpm --filter @cryptex/desktop exec vite --version

      - name: Build desktop frontend
        run: pnpm --filter @cryptex/desktop build

      - name: Test Desktop retrieval response policy
        run: pnpm --filter @cryptex/desktop test:search-policy

      - name: Test connection settings UI policy
        run: pnpm --filter @cryptex/desktop test:connection-settings

      - name: Test truthful native profile status
        run: pnpm --filter @cryptex/desktop test:native-profile-status

      - name: Validate Cargo workspace manifest
        run: cargo metadata --locked --format-version 1 --no-deps

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Verify native Mac frame and right ownership
        if: runner.os == 'macOS'
        run: sh scripts/m8/test-mac-owner-native.sh

      - name: Check Rust workspace
        run: cargo check --locked --workspace

      - name: Test M0 storage benchmark harness
        run: cargo test --locked -p m0-storage-bench

      - name: Test M0 cryptexd lifecycle harness
        if: runner.os != 'Windows'
        run: cargo test --locked -p cryptexd

      - name: Test daemon with real standard-user ownership (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/m8/run-daemon-tests-standard-user-ci.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cryptexd --doc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test M2 event and storage crates
        run: cargo test --locked -p cryptex-events -p cryptex-storage

      - name: Test M3 projection crate
        run: cargo test --locked -p cryptex-projection

      - name: Test M4 knowledge reducer and SQLite recovery
        run: cargo test --locked -p cryptex-knowledge

      - name: Check M2 schema TypeScript drift
        run: pnpm --filter @cryptex/schemas check:drift

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check independent M8 schema and signed-case conformance
        run: |
          python -m pip install -r tools/m8-protocol-vectors/schema-requirements.txt
          python -B tools/m8-protocol-vectors/check_schemas.py

      - name: Test M0 lifecycle compare harness
        run: cargo test --locked -p m0-lifecycle-compare

      - name: Test M0 local IPC spike
        run: cargo test --locked -p m0-ipc-spike

      - name: Test Desktop Rust foundation
        run: cargo test --locked -p cryptex-desktop

      - name: Build native helpers for Node failure-path and Golden tests
        run: cargo build --locked -p m0-lifecycle-compare -p m0-storage-bench

      - name: Build embedded-frontend release Desktop for negative pre-Tauri CLI tests
        run: cargo build --locked --release -p cryptex-desktop --features tauri/custom-protocol

      - name: Test release Desktop namespace and frontend build mode
        run: cargo test --locked --release -p cryptex-desktop --features tauri/custom-protocol

      - name: Lint release-only Desktop paths
        run: cargo clippy --locked --release -p cryptex-desktop --features tauri/custom-protocol --all-targets -- -D warnings

      - name: Test Node foundation, recovery, packaging and Syncthing boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $desktopName = if ($IsWindows) { 'cryptex-desktop.exe' } else { 'cryptex-desktop' }
          $env:CRYPTEX_PILOT_DESKTOP_TEST_BINARY = Join-Path $env:GITHUB_WORKSPACE "target/release/$desktopName"
          $lifecycleTests = @(Get-ChildItem -LiteralPath 'tools/m0-lifecycle-compare/scripts' -Filter '*.test.mjs' -File | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($lifecycleTests.Count -eq 0) { throw 'Lifecycle test inventory missing' }
          node --test @lifecycleTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tools/m0-storage-bench/scripts/capture-syncthing-p0-1-raw-result.test.mjs apps/desktop/scripts/prepare-cryptexd-sidecar.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run cryptexd foundation binary
        run: cargo run --locked -p cryptexd --quiet

      # Physical native-host proofs and final human/ADR acceptance are retained
      # separately. These tests do not certify installed/signed distribution.

  ipc-acl:
    if: ${{ !inputs.mac_keychain_diagnostic_only && !inputs.mac_window_collector_only && !inputs.mac_fd_repro_only && !inputs.mac_import_diagnostics_only && (!inputs.schema_candidate_only && (github.event_name != 'workflow_dispatch' || (!inputs.desktop_startup_only && !inputs.mac_identity_preflight_only && !inputs.windows_desktop_build_only))) }}
    name: IPC cross-account ACL (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy

      - name: Build IPC candidate
        run: cargo build --locked -p m0-ipc-spike

      - name: Verify actual different-user access denial
        run: |
          powershell.exe -NoProfile -NonInteractive -File tools/m0-ipc-spike/scripts/test-windows-ipc-acl-ci.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  mac-identity-preflight:
    if: ${{ !inputs.mac_keychain_diagnostic_only && !inputs.mac_window_collector_only && !inputs.mac_fd_repro_only && !inputs.mac_import_diagnostics_only && (!inputs.schema_candidate_only && (github.event_name == 'workflow_dispatch' && !inputs.desktop_startup_only && inputs.mac_identity_preflight_only)) }}
    uses: ./.github/workflows/m8-macos-identity-preflight.yml

  windows-desktop-build:
    if: ${{ !inputs.mac_keychain_diagnostic_only && !inputs.mac_window_collector_only && !inputs.mac_fd_repro_only && !inputs.mac_import_diagnostics_only && (!inputs.schema_candidate_only && (github.event_name == 'workflow_dispatch' && !inputs.desktop_startup_only && !inputs.mac_identity_preflight_only && inputs.windows_desktop_build_only)) }}
    name: Windows Desktop package (unsigned, manual only)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check sidecar staging
        run: pnpm --dir apps/desktop test:sidecar-build-script

      - name: Build unsigned NSIS package
        run: pnpm --filter @cryptex/desktop tauri:package --bundles nsis

      - name: Test release Desktop path and status helpers
        run: cargo test -p cryptex-desktop --bin cryptex-desktop --release --locked --features tauri/custom-protocol

      - name: Stage artifacts with provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'cryptex-windows-package'
          New-Item -ItemType Directory -Path $artifactRoot | Out-Null
          Copy-Item -LiteralPath 'target/release/cryptex-desktop.exe' -Destination $artifactRoot
          Copy-Item -LiteralPath 'apps/desktop/src-tauri/binaries/cryptexd-x86_64-pc-windows-msvc.exe' -Destination (Join-Path $artifactRoot 'cryptexd.exe')
          $installers = @(Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'NSIS installer missing' }
          foreach ($installer in $installers) {
            Copy-Item -LiteralPath $installer.FullName -Destination $artifactRoot
          }
          $files = @(Get-ChildItem -LiteralPath $artifactRoot -File | ForEach-Object {
            [ordered]@{ name = $_.Name; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash; bytes = $_.Length }
          })
          [ordered]@{
            source_commit = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            target = 'x86_64-pc-windows-msvc'
            signing = 'unsigned development artifact; not release acceptance'
            files = $files
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $artifactRoot 'provenance.json') -Encoding utf8NoBOM

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: cryptex-windows-package-${{ github.sha }}
          path: ${{ runner.temp }}/cryptex-windows-package/
          if-no-files-found: error
          retention-days: 7

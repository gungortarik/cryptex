name: M14 installed update and rollback
on:
  workflow_dispatch:
  push:
    branches: ['codex/m14-login-startup']
    paths:
      - '.github/workflows/m14-installed-update.yml'
      - 'scripts/m14/installed_update.py'
      - 'apps/desktop/src-tauri/**'
      - 'services/cryptexd/src/ipc.rs'
      - 'services/cryptexd/src/compat.rs'
      - 'scripts/m8/*standard-user*.ps1'
permissions:
  contents: read
jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - name: Build the three native installers
        run: python -B scripts/m14/installed_update.py build "${{ runner.temp }}/m14-packages"
      - name: Exercise installed update and rollback in the disposable Mac account
        if: runner.os == 'macOS'
        run: python -B scripts/m14/installed_update.py exercise "${{ runner.temp }}/m14-packages"
      - name: Exercise installed update and rollback as a temporary Windows standard user
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/m8/run-daemon-tests-standard-user-ci.ps1 -M14UpdatePackages "$env:RUNNER_TEMP/m14-packages"
      - name: Verify that unrelated IPC failures cannot qualify as a protocol rejection
        run: cargo test --locked -p cryptexd --lib health_protocol_mismatch_requires_an_explicit_correlated_rejection
      - name: Lint the installed update observer and desktop client
        run: cargo clippy --locked -p cryptex-desktop --features m14-installed-update-check -- -D warnings
      - uses: actions/upload-artifact@v4
        with:
          name: m14-installed-update-${{ runner.os }}
          path: ${{ runner.temp }}/m14-installed-update.json
          if-no-files-found: error

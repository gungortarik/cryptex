name: M17 installed Mac peer verification
on:
  workflow_dispatch:
  push:
    branches: ['codex/m17-release-candidate']
    paths:
      - '.github/workflows/m17-sealed-startup.yml'
      - 'scripts/m17/mac_sealed_startup.py'
      - 'scripts/m17/mac_sealed_profile.py'
      - 'scripts/m17/mac_update_credential.py'
      - 'scripts/m17/mac_installed_transport.py'
      - 'scripts/m17/mac_pairing_window.swift'
      - 'scripts/m17/mac_pairing_field_fixture.swift'
      - 'scripts/m17/fixture_responder.rs'
      - 'scripts/m17/paired_release_handoff.py'
      - 'scripts/m17/previous_daemon.py'
      - 'services/cryptexd/src/ipc/native_profile.rs'
      - 'scripts/m17/mac_reopened_window.swift'
      - 'scripts/m17/sign_owner_update.py'
      - 'scripts/m17/prepare_mac_inventory.py'
      - 'scripts/m17/build_owner_mac_package.py'
      - 'scripts/m17/verify_first_install_mac.py'
      - 'apps/updater/**'
      - 'scripts/m17/update_fixture.py'
      - 'scripts/m17/verify_rust_notices.py'
      - 'scripts/m17/package_owner_updater.py'
      - 'scripts/m17/updater_notices.mjs'
      - 'scripts/m8/mac_lan_setup.py'
      - 'scripts/m8/mac_ci_credential_keychain.py'
      - 'scripts/m8/mac_keychain_item_probe.m'
      - 'apps/desktop/scripts/prepare-cryptexd-sidecar.mjs'
      - 'apps/desktop/src-tauri/**'
      - 'services/cryptexd/build.rs'
      - 'services/cryptexd/build_support/**'
      - 'services/cryptexd/src/m8_owner_channel/**'
      - 'services/cryptexd/Cargo.toml'
permissions:
  contents: read
jobs:
  pairing-preflight:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the installed pairing UI driver and report the runner's existing UI access
        run: |
          swiftc -typecheck scripts/m17/mac_pairing_window.swift
          swift -e 'import ApplicationServices; print("hosted_accessibility_available=\(AXIsProcessTrusted())")'
          contents="$RUNNER_TEMP/PairingField.app/Contents"
          mkdir -p "$contents/MacOS"
          plutil -create xml1 "$contents/Info.plist"
          plutil -insert CFBundleIdentifier -string com.cryptex.test.pairing-field "$contents/Info.plist"
          plutil -insert CFBundleExecutable -string m17-field-fixture "$contents/Info.plist"
          plutil -insert CFBundlePackageType -string APPL "$contents/Info.plist"
          swiftc scripts/m17/mac_pairing_field_fixture.swift -o "$contents/MacOS/m17-field-fixture"
          cp "$contents/MacOS/m17-field-fixture" "$RUNNER_TEMP/m17-cover-window"
          codesign --force --sign - "$RUNNER_TEMP/PairingField.app"
          python -B - <<'PY'
          import sys
          sys.path.insert(0, "scripts/m8")
          from mac_identity_preflight import run_bounded
          result = run_bounded(["/usr/bin/swift", "scripts/m17/mac_pairing_window.swift", "--check-text-input"], 100)
          if result.code or result.timed_out or result.limited or result.pipe_failed:
              raise RuntimeError("Hosted WebKit preflight failed: " + result.output[-512:])
          print(result.output)
          PY
  sealed-startup:
    needs: pairing-preflight
    strategy:
      fail-fast: false
      matrix:
        profile: [ephemeral, persistent]
    runs-on: macos-26
    timeout-minutes: ${{ matrix.profile == 'persistent' && 65 || 45 }}
    env:
      M17_MAC_TRIAL: ${{ matrix.profile }}
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - name: Build the previous Mac daemon from the 1.0.1 source
        if: matrix.profile == 'persistent'
        run: python -B scripts/m17/previous_daemon.py
      - run: python -B scripts/m17/mac_sealed_startup.py

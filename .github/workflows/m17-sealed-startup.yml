name: M17 installed Mac peer verification
on:
  workflow_dispatch:
  push:
    branches: ['codex/m17-release-candidate']
    paths:
      - '.github/workflows/m17-sealed-startup.yml'
      - 'scripts/m17/mac_sealed_startup.py'
      - 'scripts/m17/mac_sealed_profile.py'
      - 'scripts/m17/mac_update_credential.py'
      - 'scripts/m17/previous_daemon.py'
      - 'services/cryptexd/src/ipc/native_profile.rs'
      - 'scripts/m17/mac_reopened_window.swift'
      - 'scripts/m17/sign_owner_update.py'
      - 'scripts/m17/prepare_mac_inventory.py'
      - 'scripts/m17/build_owner_mac_package.py'
      - 'scripts/m17/verify_first_install_mac.py'
      - 'apps/updater/**'
      - 'scripts/m17/update_fixture.py'
      - 'scripts/m8/mac_lan_setup.py'
      - 'apps/desktop/scripts/prepare-cryptexd-sidecar.mjs'
      - 'apps/desktop/src-tauri/**'
      - 'services/cryptexd/build.rs'
      - 'services/cryptexd/build_support/**'
      - 'services/cryptexd/src/m8_owner_channel/**'
      - 'services/cryptexd/Cargo.toml'
permissions:
  contents: read
jobs:
  sealed-startup:
    strategy:
      fail-fast: false
      matrix:
        profile: [ephemeral, persistent]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      M17_MAC_TRIAL: ${{ matrix.profile }}
      MACOSX_DEPLOYMENT_TARGET: '26.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - name: Build the previous Mac daemon from the 1.0.1 source
        if: matrix.profile == 'persistent'
        run: python -B scripts/m17/previous_daemon.py
      - run: python -B scripts/m17/mac_sealed_startup.py
